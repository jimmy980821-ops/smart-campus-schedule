name: Send campus reminders

on:
  schedule:
    # GitHub cron 明確使用 UTC；臺灣時間為 UTC+8。
    # 作業：臺灣 07:07/17/27（前一日 UTC 23 時）與 20:07/17/27（UTC 12 時）。
    - cron: "7,17,27 23 * * *"
    - cron: "7,17,27 12 * * *"

    # 學測：臺灣每日 08:07/17/27，三次巡檢並以通知 key 去重。
    - cron: "7,17,27 0 * * *"

    # 課程：每節課前提供至少兩次巡檢機會，降低單次排程遭延遲或略過的影響。
    # 第一至第四節與第五節（臺灣 08:10～13:10）。
    - cron: "0,5 0-3,5 * * 1-5"
    # 第六節臺灣 14:20。
    - cron: "5,10,15 6 * * 1-5"
  workflow_dispatch:
    inputs:
      send_test:
        description: "忽略課表時間並發送測試通知"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Send scheduled notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SEND_TEST: ${{ inputs.send_test || 'false' }}
        run: node scripts/send-class-reminders.mjs
