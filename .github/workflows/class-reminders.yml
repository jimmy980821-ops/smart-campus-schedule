name: Send campus reminders

on:
  schedule:
    # 臺灣時間每天 07:00、08:00–14:59 與 20:00 時段，每五分鐘檢查一次。
    # 課程只會在平日觸發；作業與學測提醒包含週末。
    - cron: "*/5 23,0-6,12 * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "忽略課表時間並發送測試通知"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Send scheduled notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SEND_TEST: ${{ inputs.send_test || 'false' }}
        run: node scripts/send-class-reminders.mjs
