name: Send campus reminders

on:
  schedule:
    # 使用少量、錯開整點的臺灣時間排程，降低 GitHub 延遲或略過工作的機率。
    # 作業到期日早上與前一晚各安排兩次備援。
    - cron: "7,17 7 * * *"
      timezone: "Asia/Taipei"
    - cron: "7,17 20 * * *"
      timezone: "Asia/Taipei"

    # 學測每日倒數；相同通知 key 會避免重複推播。
    - cron: "17,27 8 * * *"
      timezone: "Asia/Taipei"

    # 平日課程主要排程（約上課前 12 分鐘）與備援排程（約前 7 分鐘）。
    - cron: "58 7-10,12 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "3 8-11,13 * * 1-5"
      timezone: "Asia/Taipei"

    # 第六節 14:20 上課，另外安排兩次提醒機會。
    - cron: "8,13 14 * * 1-5"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      send_test:
        description: "忽略課表時間並發送測試通知"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Send scheduled notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SEND_TEST: ${{ inputs.send_test || 'false' }}
        run: node scripts/send-class-reminders.mjs
